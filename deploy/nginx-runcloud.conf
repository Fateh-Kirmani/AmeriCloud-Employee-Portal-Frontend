# AmeriCloud Employee Portal — Nginx hardening config
# HOW TO APPLY: RunCloud → portal web app → Nginx Config → paste entire file → Rebuild/Reload Nginx
# This file is REFERENCE ONLY — changes here do not auto-apply; re-paste in RunCloud after each edit.

# ── Security headers ──────────────────────────────────────────────────────────
add_header X-Frame-Options             "SAMEORIGIN"                               always;
add_header X-Content-Type-Options      "nosniff"                                  always;
add_header Referrer-Policy             "strict-origin-when-cross-origin"          always;
add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy  "same-origin-allow-popups"                 always;

# Content Security Policy
# Allows: MSAL.js from jsDelivr CDN, Google Fonts, Microsoft login + graph endpoints
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; img-src 'self' data:; frame-src https://login.microsoftonline.com; frame-ancestors 'none';" always;

# HSTS — uncomment AFTER Let's Encrypt SSL is confirmed working on portal.americloudtelecom.com
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── Block internal config and markdown files ──────────────────────────────────
location ~ \.(md|conf)$ {
    deny all;
    return 404;
}

# Block dotfiles (.git, .env, etc.)
location ~ /\. {
    deny all;
    return 404;
}

# Allow .well-known for Let's Encrypt certificate renewal
location ^~ /.well-known/ {
    allow all;
    try_files $uri =404;
}
